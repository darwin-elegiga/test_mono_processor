name: 'Close stale issues and PR/s'
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # every day at 2am

jobs:
  stale:
    runs-on: uhg-runner
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/stale@v9
        with:
          stale-pr-message: 'This pull request is stale because it has been open for 14 days with no activity. Remove stale label or comment or this will be closed in 30 days.'
          days-before-pr-stale: 14
          days-before-pr-close: 30
          days-before-issue-stale: -1
          delete-branch: true
