name: GitLabRepoSync
on: [push, workflow_dispatch]

jobs:
  send-curl:
    runs-on: 
      group: vpay-runner-group
    steps:
      - run: |
          curl --insecure --request POST --header "PRIVATE-TOKEN: ${{ secrets.VPAY_GITLAB_API_SERVICE_ACCOUNT }}" "https://gitlab.vpayusa.net/api/v4/projects/558/mirror/pull"
