name: build-and-deploy-to-dev
permissions:
  contents: write
  actions: read
  id-token: write
  pull-requests: read 
  packages: read 
  security-events: write
on: 
  workflow_dispatch:
    inputs:
      PRE:
        required: true
        type: boolean
        default: true
  release:
    types: [published]
  push:
    tags:
    - '*'

jobs:
    sonar:
     uses: optum-financial/vpay-actions-common-workflow/.github/workflows/sonar-analysis-dotnet.yml@main
     secrets:
       sonar-token: ${{ secrets.SONAR_TOKEN }}
      
    api:
        needs: sonar
        if: always()
        uses: optum-financial/vpay-actions-common-workflow/.github/workflows/docker-build-and-publish-saas.yml@main
        with: 
            PROJECT: ols-processor 
            IMAGE_NAME: api
            DOCKER_URL: "centraluhg.jfrog.io"
            BUILD_ARGS_ENV_FILE_PATH: .github/build-args/api/
            PRE: ${{ (inputs.PRE == true || github.event_name == 'push' ) && github.event_name != 'release' }} 
            
    queue-consumer:
        needs: sonar
        if: always()
        uses: optum-financial/vpay-actions-common-workflow/.github/workflows/docker-build-and-publish-saas.yml@main
        with: 
            PROJECT: ols-processor 
            IMAGE_NAME: queue-consumers
            DOCKER_URL: "centraluhg.jfrog.io"
            BUILD_ARGS_ENV_FILE_PATH: .github/build-args/queue-consumer/
            PRE: ${{ (inputs.PRE == true || github.event_name == 'push' ) && github.event_name != 'release' }}
            
    deployment-plano-dev:
       if: always()
       uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-plano-dev.yml@main
       needs: [api, queue-consumer]
       with: 
            CHARTS_PATH: charts/ols-processor
            NAMESPACE: ols-processor-dev
            RELEASE_NAME: ols-processor
            DRYRUN: false
       secrets: inherit
    deployment-stl-dev:
        if: always()
        uses: optum-financial/vpay-actions-common-workflow/.github/workflows/helm-deploy-stl-dev.yml@main
        needs: [api, queue-consumer]
        with: 
            CHARTS_PATH: charts/ols-processor
            NAMESPACE: ols-processor-dev
            RELEASE_NAME: ols-processor
            DRYRUN: false
        secrets: inherit    
