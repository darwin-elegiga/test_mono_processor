smbShares:
  ols-rw:
    source: '{{ vault "devops/pks/${DEPLOYMENT}/olsSmb" "source" }}'
    username: '{{ vault "devops/pks/${DEPLOYMENT}/olsSmb" "username" }}'
    password: '{{ vault "devops/pks/${DEPLOYMENT}/olsSmb" "password" }}'
  files-smb:
    username: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/smb" "username" }}'
    password: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/smb" "password" }}'

api:
  secrets:
    appsettings.secure.json:
      data:
        OlsProcessorQueue:
          username: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/rabbit" "username" }}'
          password: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/rabbit" "password" }}'
        OlsDatabase:
          Username: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "username" }}'
          Password: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "password" }}'
          Hostname: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "hostname" }}'
          Database: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "database" }}'

queue-consumers:
  secrets:
    appsettings.secure.json:
      data:
        OlsProcessorQueue:
          username: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/rabbit" "username" }}'
          password: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/rabbit" "password" }}'
        OlsDatabase:
          Username: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "username" }}'
          Password: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "password" }}'
          Hostname: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "hostname" }}'
          Database: '{{ vault "dba/Accounts/Application/${DEPLOYMENT}/OLSProcessor" "database" }}'
        FileTransferServiceRabbitQueue:
          username: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/rabbit" "username" }}'
          password: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/rabbit" "password" }}'
    id-rsa.key:
      data: '{{ vault "engineering/ols/olsprocessor/${DEPLOYMENT}/signing_keys" "private_key" }}'
      isEncoded: true

