version: '3.5'

services:
  vpay.ols.processor.api:
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=LocalDevelopment
      - DOTNET_ENVIRONMENT=LocalDevelopment
      - ASPNETCORE_Logging__GELF__AdditionalFields__namespace=ols-processor-api-local
      - DOTNET_Logging__GELF__AdditionalFields__namespace=ols-processor-api-local
    ports:
      - "80"
    networks:
      - olsprocessor

  vpay.ols.processor.queueconsumers:
    environment:
      - ASPNETCORE_ENVIRONMENT=LocalDevelopment
      - DOTNET_ENVIRONMENT=LocalDevelopment
      - ASPNETCORE_Logging__GELF__AdditionalFields__namespace=ols-processor-queueconsumers-local
      - DOTNET_Logging__GELF__AdditionalFields__namespace=ols-processor-queueconsumers-local
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ./keys/id_rsa_localonly:/root/.ssh/keys/id_rsa:ro
    networks:
      - olsprocessor

  ols-processor-rabbitmq:
    networks:
      - olsprocessor

  ols-sqlserver:
    networks:
      - olsprocessor

  ols-migrate:
    networks:
      - olsprocessor


networks:
  olsprocessor:
    name: olsprocessor
    driver: bridge
